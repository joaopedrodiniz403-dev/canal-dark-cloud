name: Nuvem Escura - cortes autorizados
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
permissions:
  contents: read
concurrency:
  group: nuvem-escura-producao
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg e ASR local
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-cuts.txt
      - name: Restaurar histórico e modelos
        uses: actions/cache/restore@v4
        with:
          path: |
            work/state.sqlite
            ~/.cache/huggingface
          key: cuts-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cuts-v2-
      - name: Produzir até cinco cortes para revisão
        run: python -m nuvem.engine
      - name: Persistir histórico
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/state.sqlite
            ~/.cache/huggingface
          key: cuts-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Entregar fila, legendas, logs e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuvem-escura-revisao-${{ github.run_number }}
          path: output/cuts/
          if-no-files-found: error
          retention-days: 7
