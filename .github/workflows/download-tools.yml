name: Baixar repositorios auditaveis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - agent/upstreams.lock.json
      - tools/download_upstreams.py
      - .github/workflows/download-tools.yml
  push:
    branches: [main]
    paths:
      - agent/upstreams.lock.json
      - tools/download_upstreams.py
      - .github/workflows/download-tools.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "value=$(python tools/download_upstreams.py --list)" >> "$GITHUB_OUTPUT"
  download:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar revisao fixa sem instalar ou executar
        env:
          UPSTREAM_ID: ${{ matrix.id }}
        run: python tools/download_upstreams.py --id "$UPSTREAM_ID"
      - name: Entregar fonte e comprovante SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: fonte-${{ matrix.id }}
          path: |
            work/upstreams/${{ matrix.id }}/*.tar.gz
            work/upstreams/${{ matrix.id }}/download-report.json
          if-no-files-found: error
          retention-days: 30
