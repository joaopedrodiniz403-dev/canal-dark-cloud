name: Validar motor de cortes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Testes unitários e renderização real
        run: python -m unittest discover -v
  upstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mehbul/chopify
          ref: d576927bf3b764733c97ac1ad324aa9957b0885d
          path: work/chopify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências mínimas para importar o CLI upstream
        run: python -m pip install -r requirements-cuts.txt numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Verificar o CLI real do Chopify (sem gerar amostra)
        run: |
          python work/chopify/chopify.py --version
          python work/chopify/chopify.py --help
      - name: Verificar decodificacao real usada pelo ASR (sem modelo)
        run: python -m unittest tests.test_audio_runtime -v
