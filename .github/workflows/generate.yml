name: Gerar Short para revisao
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Gerar video
        run: python main.py
      - name: Disponibilizar video e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-para-revisao-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
