name: Validar motor de cortes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Testes unitários e renderização real
        run: python -m unittest discover -v
      - name: Amostra técnica reproduzível (sem fala)
        run: python -m tests.demo
      - name: Evidências técnicas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-motor-cortes-${{ github.run_number }}
          path: output/demo/
          retention-days: 7
          if-no-files-found: warn
